<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Card de Produto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <article class="product-card">
        <div class="card-image-container">
            <span class="badge-discount">-20% OFF</span>
            <img src="tenis.jpg" alt="Tênis Nike Air Max Red" class="product-image">
        </div>

        <div class="card-content">
            <span class="category">Calçados Esportivos</span>
            <h3 class="title">Nike Air Max Red Run</h3>
            <p class="description">Máximo conforto e tecnologia de absorção de impacto para alta performance.</p>

            <div class="price-box">
                <span class="old-price">R$ 499,90</span>
                <span class="current-price">R$ 399,90</span>
            </div>

            <button class="btn-buy">Comprar Agora</button>
        </div>
    </article>

</body>
</html>
